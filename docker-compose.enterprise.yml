services:

  sirius-api:

    build:
      context: .
      dockerfile: docker/runtime/Dockerfile

    command: uvicorn sirius_platform.runtime_core.api.runtime_api:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis
      - nats

  postgres:

    image: postgres:16

    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_runtime

    ports:
      - "5432:5432"

  redis:

    image: redis:7

    ports:
      - "6379:6379"

  nats:

    image: nats:latest

    command:
      - "--jetstream"

    ports:
      - "4222:4222"

  frontend:

    image: nginx:latest

    ports:
      - "8080:80"

    volumes:
      - ./frontend/adhoc/templates:/usr/share/nginx/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
