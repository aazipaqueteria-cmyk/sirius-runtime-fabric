apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sirius-runtime

spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc

  source:
    repoURL: https://github.com/aazipaqueteria-cmyk/sirius-runtime-fabric.git
    targetRevision: HEAD
    path: k8s/base

  project: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
