apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: sirius-runtime

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  tls:
  - hosts:
    - sirius-runtime.local

    secretName: sirius-tls

  rules:
  - host: sirius-runtime.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: sirius-runtime
            port:
              number: 8000
