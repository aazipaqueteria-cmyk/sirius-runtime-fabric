version: "3.9"

services:

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  nats:
    image: nats:latest
    restart: always
    ports:
      - "4222:4222"

  prometheus:
    image: prom/prometheus
    restart: always
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    restart: always
    ports:
      - "3000:3000"
